name: sdlc-pipeline Gate Auto-Advance

# Real-time backstop for sdlc gate PRs (references/gates.md, "Real-time backstop").
# next-action detects the same events itself, so a missed run only delays, never loses, state.
#   auto-advance (pull_request closed): merged gate PR -> auto-pass-gate; closed unmerged -> needs-human
# open-gate labels every human gate PR `sdlc:gate`; the job-level `if` keeps every other PR
# (development, epic integration, pipeline-merged design PRs) from starting a runner.
# Needs secret SDLC_GH_TOKEN (classic PAT). Optional variable SDLC_PIPELINE_REF pins the plugin
# checkout; set it to the tag/sha your .claude/settings.json pins (default: main).
on:
  pull_request:
    types: [closed]

jobs:
  auto-advance:
    if: contains(github.event.pull_request.labels.*.name, 'sdlc:gate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # pass-gate merges the gate's base (main, or epic-<n> for a design PR) into the gate branch and pushes
          token: ${{ secrets.SDLC_GH_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: snitesh91/sdlc-pipeline
          ref: ${{ vars.SDLC_PIPELINE_REF || 'main' }}
          path: .sdlc-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo ".sdlc-pipeline/" >> .git/info/exclude  # keep the plugin checkout out of git status
      - name: Advance or flag this gate
        env:
          GITHUB_TOKEN: ${{ secrets.SDLC_GH_TOKEN }}
        run: python3 .sdlc-pipeline/scripts/sdlc_next.py auto-pass-gate --pr ${{ github.event.pull_request.number }}
